<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聲控解謎成語大冒險 - 國小中高年級成語語音學習網頁遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 50%, #fbcfe8 100%);
            min-height: 100vh;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 22px rgba(251, 191, 36, 0.9)); }
        }

        @keyframes fill-pop {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes wave-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .animate-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }

        .animate-fill {
            animation: fill-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .wave-bar {
            animation: wave-bounce 0.8s infinite ease-in-out;
        }

        .tile-card {
            box-shadow: 0 10px 0 #d97706, 0 15px 20px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
        }

        .tile-card:active {
            transform: translateY(4px);
            box-shadow: 0 6px 0 #d97706, 0 8px 10px rgba(0,0,0,0.15);
        }

        .missing-tile {
            border: 3px dashed #f59e0b;
            background: rgba(254, 243, 199, 0.6);
        }

        .completed-tile {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #ffffff;
            border: 3px solid #fef3c7;
            text-shadow: 2px 2px 0px #b45309;
        }
    </style>
</head>
<body class="p-3 md:p-6 text-slate-800 flex flex-col items-center justify-between min-h-screen">

    <header class="w-full max-w-4xl mx-auto flex justify-between items-center bg-white/80 backdrop-blur-md p-4 rounded-3xl shadow-lg border-2 border-amber-200 mb-4">
        <div class="flex items-center gap-3">
            <div class="bg-amber-400 text-white p-3 rounded-2xl shadow-inner text-xl md:text-2xl font-black">
                <i class="fa-solid fa-microphone-lines"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-black text-amber-900 tracking-wide">聲控解謎成語大冒險</h1>
                <p class="text-xs md:text-sm text-amber-700 font-bold">國小中高年級必備成語朗讀闖關</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="bg-amber-100 border border-amber-300 px-3 py-1.5 rounded-2xl flex items-center gap-2">
                <i class="fa-solid fa-star text-amber-500 text-lg"></i>
                <span id="star-count" class="font-black text-amber-900 text-lg">0</span>
            </div>
            <button id="category-btn" onclick="toggleCategoryModal()" class="bg-sky-500 hover:bg-sky-600 active:scale-95 text-white px-3 py-1.5 rounded-2xl font-bold shadow text-sm transition">
                <i class="fa-solid fa-book-open mr-1"></i> 成語題庫
            </button>
        </div>
    </header>

    <main class="w-full max-w-4xl mx-auto flex-1 flex flex-col justify-center items-center gap-6">

        <!-- Progress and Level Badge -->
        <div class="w-full flex justify-between items-center px-2">
            <span id="category-badge" class="bg-amber-500 text-white font-black text-xs md:text-sm px-4 py-1.5 rounded-full shadow">
                動物篇 (關卡 1/15)
            </span>
            <div class="flex items-center gap-1">
                <span class="text-xs font-bold text-slate-600">完成度：</span>
                <div class="w-32 md:w-48 bg-slate-200 h-3 rounded-full overflow-hidden border border-slate-300">
                    <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>
        </div>

        <!-- Puzzle Card -->
        <div class="w-full bg-white/90 backdrop-blur-md rounded-3xl p-6 md:p-10 shadow-xl border-4 border-amber-300 flex flex-col items-center gap-6 relative">
            
            <!-- Audio Standard Demo Button -->
            <div class="w-full flex justify-end">
                <button id="demo-speech-btn" onclick="playStandardSpeech()" class="flex items-center gap-2 bg-indigo-100 hover:bg-indigo-200 border border-indigo-300 text-indigo-800 px-4 py-2 rounded-2xl font-bold text-sm shadow-sm transition active:scale-95">
                    <i class="fa-solid fa-volume-high text-indigo-600 text-lg"></i>
                    <span>標準語音示範</span>
                </button>
            </div>

            <!-- Idiom Missing Character Display -->
            <div id="idiom-tiles-container" class="flex justify-center items-center gap-2 md:gap-4 my-4 flex-wrap">
                <!-- Tiles will be dynamically injected here -->
            </div>

            <!-- Idiom Pinyin & Zhuyin Hint -->
            <div class="text-center">
                <p id="pinyin-hint" class="text-slate-500 font-bold text-sm md:text-base tracking-widest h-6">
                    shǒu zhū dài tù
                </p>
                <p id="idiom-meaning" class="text-slate-700 font-medium text-base md:text-lg mt-2 bg-amber-50/80 px-4 py-2 rounded-xl border border-amber-200 max-w-xl">
                    釋義：比喻拘泥守舊，不知變通，或等著不勞而獲。
                </p>
            </div>

            <!-- Microphone & Voice Controls -->
            <div class="w-full flex flex-col items-center gap-4 mt-2">
                <!-- Listening Wave Indicator -->
                <div id="recording-wave" class="hidden flex items-center justify-center gap-1.5 h-8">
                    <div class="w-1.5 h-6 bg-rose-500 rounded-full wave-bar" style="animation-delay: 0.1s"></div>
                    <div class="w-1.5 h-8 bg-rose-500 rounded-full wave-bar" style="animation-delay: 0.2s"></div>
                    <div class="w-1.5 h-10 bg-rose-500 rounded-full wave-bar" style="animation-delay: 0.3s"></div>
                    <div class="w-1.5 h-6 bg-rose-500 rounded-full wave-bar" style="animation-delay: 0.4s"></div>
                    <span class="text-xs font-black text-rose-600 ml-2 animate-pulse">正在聆聽中... 請唸出完整成語！</span>
                </div>

                <!-- Voice Mic Button -->
                <button id="mic-btn" onclick="toggleVoiceRecognition()" class="relative group bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 active:scale-95 text-white font-black text-lg md:text-xl px-8 py-4 rounded-full shadow-lg border-2 border-amber-200 flex items-center gap-3 transition">
                    <i id="mic-icon" class="fa-solid fa-microphone text-2xl"></i>
                    <span id="mic-btn-text">按住或點擊開口朗讀</span>
                </button>

                <!-- Recognition Result Preview -->
                <div class="flex items-center gap-2 min-h-[32px]">
                    <span class="text-xs font-bold text-slate-400">辨識到的內容：</span>
                    <span id="recognized-text" class="font-bold text-amber-800 text-base md:text-lg bg-amber-100/60 px-3 py-1 rounded-lg border border-amber-200 min-w-[120px] text-center">
                        ...
                    </span>
                </div>
            </div>

            <!-- Fallback Manual Input Option for accessibility/no mic -->
            <div class="w-full border-t border-amber-100 pt-4 flex justify-between items-center text-xs text-slate-500">
                <span id="mic-status-msg" class="text-emerald-600 font-bold"><i class="fa-solid fa-circle-check mr-1"></i>麥克風語音辨識就緒</span>
                <button onclick="toggleManualInputModal()" class="text-indigo-600 hover:underline font-bold">
                    <i class="fa-solid fa-keyboard mr-1"></i>麥克風不可用？改用鍵盤輸入
                </button>
            </div>
        </div>

        <!-- Navigation Action Buttons -->
        <div class="w-full flex justify-between items-center gap-4">
            <button id="prev-btn" onclick="prevIdiom()" class="bg-white hover:bg-slate-50 text-slate-700 font-bold px-5 py-2.5 rounded-2xl shadow border border-slate-200 active:scale-95 transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> 上一題
            </button>
            <button id="skip-btn" onclick="skipIdiom()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-5 py-2.5 rounded-2xl border border-amber-300 active:scale-95 transition">
                提示 / 跳過
            </button>
            <button id="next-btn" onclick="nextIdiom()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-2xl shadow border border-emerald-400 active:scale-95 transition flex items-center gap-2">
                下一題 <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </main>

    <footer class="w-full max-w-4xl mx-auto text-center my-4 text-xs font-bold text-slate-500">
        <p>國小語文輔助教學平台 ｜ 聲控互動解謎機制 ｜ 支援 Speech Recognition API</p>
    </footer>

    <!-- SUCCESS ANIMATION OVERLAY -->
    <div id="success-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex flex-col justify-center items-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full flex flex-col items-center text-center shadow-2xl border-4 border-amber-400 animate-fill">
            <div class="w-24 h-24 bg-amber-100 text-amber-500 rounded-full flex justify-center items-center text-5xl mb-4 border-4 border-amber-300 shadow-inner">
                <i class="fa-solid fa-trophy animate-bounce"></i>
            </div>
            <h2 class="text-3xl font-black text-amber-900 mb-2">朗讀正確！太棒了！</h2>
            <p id="success-idiom-text" class="text-2xl font-black text-amber-600 tracking-wider mb-2">守株待兔</p>
            <p id="success-idiom-detail" class="text-sm text-slate-600 bg-amber-50 p-3 rounded-xl border border-amber-200 mb-6">
                你成功答對了「兔」字！
            </p>
            <button onclick="closeSuccessAndNext()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black py-3.5 rounded-2xl text-lg shadow-lg active:scale-95 transition">
                挑戰下一關 <i class="fa-solid fa-circle-chevron-right ml-1"></i>
            </button>
        </div>
    </div>

    <!-- CATEGORY SELECT MODAL -->
    <div id="category-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-2xl w-full shadow-2xl border-2 border-amber-200 flex flex-col gap-4 max-h-[85vh]">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-xl font-black text-amber-900 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-amber-500"></i> 選擇成語主題類別
                </h3>
                <button onclick="toggleCategoryModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">
                    &times;
                </button>
            </div>
            <div id="category-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 overflow-y-auto p-1">
                <!-- Categories rendered dynamically -->
            </div>
        </div>
    </div>

    <!-- MANUAL INPUT FALLBACK MODAL -->
    <div id="manual-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border-2 border-amber-200 flex flex-col gap-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-lg font-black text-slate-800">手動輸入成語解答</h3>
                <button onclick="toggleManualInputModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <p class="text-sm text-slate-600">如果語音辨識遇到困難，請在下方輸入完整的成語：</p>
            <input type="text" id="manual-input" placeholder="請輸入4字成語（例如：守株待兔）" class="w-full border-2 border-amber-300 rounded-2xl p-3 text-center text-lg font-bold focus:outline-none focus:border-amber-500">
            <button onclick="submitManualInput()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-2xl shadow active:scale-95 transition">
                確認送出
            </button>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. Elementary Grade Idiom Database (國小中高年級精選成語庫)
        // ----------------------------------------------------
        const IDIOM_DATABASE = [
            {
                category: "動物篇",
                items: [
                    { idiom: "守株待兔", missingIndex: 3, pinyin: "shǒu zhū dài tù", meaning: "比喻拘泥守舊，不知變通，或等著不勞而獲。", keywords: ["守株待兔", "待兔"] },
                    { idiom: "畫蛇添足", missingIndex: 2, pinyin: "huà shé tiān zú", meaning: "比喻多此一舉，不但無益，反而不妥。", keywords: ["畫蛇添足", "添足"] },
                    { idiom: "狐假虎威", missingIndex: 1, pinyin: "hú jiǎ hǔ wēi", meaning: "比喻藉著有權者的勢力欺壓他人。", keywords: ["狐假虎威", "假虎威"] },
                    { idiom: "井底之蛙", missingIndex: 3, pinyin: "jǐng dǐ zhī wā", meaning: "比喻見識淺薄的人。", keywords: ["井底之蛙", "之蛙"] },
                    { idiom: "盲人摸象", missingIndex: 2, pinyin: "máng rén mō xiàng", meaning: "比喻看問題片面，以偏概全。", keywords: ["盲人摸象", "摸象"] }
                ]
            },
            {
                category: "自然與景物",
                items: [
                    { idiom: "水落石出", missingIndex: 2, pinyin: "shuǐ luò shí chū", meaning: "比喻事情的真相完全大白。", keywords: ["水落石出", "石出"] },
                    { idiom: "風和日麗", missingIndex: 1, pinyin: "fēng hé rì lì", meaning: "形容天氣晴朗，風光明媚。", keywords: ["風和日麗", "和日麗"] },
                    { idiom: "春暖花開", missingIndex: 3, pinyin: "chūn nuǎn huā kāi", meaning: "形容春天的景色溫暖美麗。", keywords: ["春暖花開", "花開"] },
                    { idiom: "拔苗助長", missingIndex: 0, pinyin: "bá miáo zhù zhǎng", meaning: "比喻急於求成，反而把事情弄糟糕。", keywords: ["拔苗助長", "拔苗"] }
                ]
            },
            {
                category: "智慧與學習",
                items: [
                    { idiom: "專心致志", missingIndex: 2, pinyin: "zhuān xīn zhì zhì", meaning: "形容一心一意，非常專心。", keywords: ["專心致志", "致志"] },
                    { idiom: "溫故知新", missingIndex: 3, pinyin: "wēn gù zhī xīn", meaning: "複習過去學過的知識，能有新的體會與收穫。", keywords: ["溫故知新", "知新"] },
                    { idiom: "融會貫通", missingIndex: 2, pinyin: "róng huì guàn tōng", meaning: "將各種知識道理融合串連，徹底理解。", keywords: ["融會貫通", "貫通"] },
                    { idiom: "舉一反三", missingIndex: 2, pinyin: "jǔ yī fǎn sān", meaning: "指列舉一件事，就能推知相關的其他許多事。", keywords: ["舉一反三", "反三"] }
                ]
            },
            {
                category: "品德與意志",
                items: [
                    { idiom: "堅持不懈", missingIndex: 3, pinyin: "jiān chí bù xiè", meaning: "堅持到底，一點也不鬆懈。", keywords: ["堅持不懈", "不懈"] },
                    { idiom: "積少成多", missingIndex: 2, pinyin: "jī shǎo chéng duō", meaning: "累積少量而漸漸聚成大量。", keywords: ["積少成多", "成多"] },
                    { idiom: "飲水思源", missingIndex: 3, pinyin: "yǐn shuǐ sī yuán", meaning: "喝水時想到水的來源。比喻不忘本。", keywords: ["飲水思源", "思源"] }
                ]
            }
        ];

        // ----------------------------------------------------
        // 2. Global State Variables
        // ----------------------------------------------------
        let currentCategoryIdx = 0;
        let currentItemIdx = 0;
        let starCount = 0;
        let isCompleted = false;
        let isListening = false;
        let recognition = null;
        let audioCtx = null;

        // ----------------------------------------------------
        // 3. Web Speech API Initialization
        // ----------------------------------------------------
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const statusMsg = document.getElementById("mic-status-msg");

            if (!SpeechRecognition) {
                statusMsg.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i>此瀏覽器不支援語音辨識，請使用手動輸入`;
                statusMsg.className = "text-amber-600 font-bold";
                return;
            }

            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'zh-TW';
                recognition.continuous = false;
                recognition.interimResults = true;

                recognition.onstart = function() {
                    isListening = true;
                    updateMicUI(true);
                };

                recognition.onresult = function(event) {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    
                    // Clean punctuation and spaces
                    const cleanedText = transcript.replace(/[^\u4e00-\u9fa5]/g, '');
                    document.getElementById("recognized-text").innerText = cleanedText || "...";

                    // Check if student successfully extracted and pronounced the target idiom
                    checkSpeechAnswer(cleanedText);
                };

                recognition.onerror = function(event) {
                    console.warn("Speech recognition error:", event.error);
                    stopListening();
                    if (event.error === 'not-allowed') {
                        alert("請允許網頁存取麥克風以進行成語朗讀闖關喔！");
                    }
                };

                recognition.onend = function() {
                    stopListening();
                };

            } catch (err) {
                console.error("Speech Recognition setup error:", err);
            }
        }

        // ----------------------------------------------------
        // 4. Sound Effects Generator (Web Audio API)
        // ----------------------------------------------------
        function playSound(type) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'success') {
                    // Chime synth
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
                    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.35); // C6

                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                }
            } catch (e) {
                console.log("Audio effect disabled:", e);
            }
        }

        // ----------------------------------------------------
        // 5. Game Core Rendering and Flow Logic
        // ----------------------------------------------------
        function getCurrentItem() {
            return IDIOM_DATABASE[currentCategoryIdx].items[currentItemIdx];
        }

        function renderIdiomPuzzle() {
            isCompleted = false;
            const category = IDIOM_DATABASE[currentCategoryIdx];
            const item = category.items[currentItemIdx];

            // Render Badges and Progress
            document.getElementById("category-badge").innerText = 
                `${category.category} (關卡 ${currentItemIdx + 1}/${category.items.length})`;

            const progressPct = ((currentItemIdx + 1) / category.items.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPct}%`;

            // Render Idiom Tiles
            const tilesContainer = document.getElementById("idiom-tiles-container");
            tilesContainer.innerHTML = "";

            const chars = item.idiom.split("");
            chars.forEach((char, idx) => {
                const tile = document.createElement("div");
                tile.className = "w-16 h-20 md:w-20 md:h-24 rounded-2xl font-black text-3xl md:text-4xl flex items-center justify-center cursor-pointer select-none transition-all duration-300";

                if (idx === item.missingIndex) {
                    tile.id = "missing-char-tile";
                    tile.classList.add("missing-tile", "text-amber-400");
                    tile.innerText = "＿";
                } else {
                    tile.classList.add("tile-card", "bg-amber-400", "text-amber-950", "border-2", "border-amber-200");
                    tile.innerText = char;
                }
                tilesContainer.appendChild(tile);
            });

            // Render Hints and Details
            document.getElementById("pinyin-hint").innerText = item.pinyin;
            document.getElementById("idiom-meaning").innerText = `釋義：${item.meaning}`;
            document.getElementById("recognized-text").innerText = "...";
        }

        // Voice Recognition Controls
        function toggleVoiceRecognition() {
            playSound('click');
            if (!recognition) {
                alert("目前使用的瀏覽器不支援語音辨識，請選用 Chrome / Edge 瀏覽器，或使用手動輸入解答。");
                return;
            }

            if (isListening) {
                stopListening();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    stopListening();
                }
            }
        }

        function stopListening() {
            isListening = false;
            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }
            updateMicUI(false);
        }

        function updateMicUI(listening) {
            const micBtn = document.getElementById("mic-btn");
            const micIcon = document.getElementById("mic-icon");
            const micText = document.getElementById("mic-btn-text");
            const wave = document.getElementById("recording-wave");

            if (listening) {
                micBtn.className = "relative group bg-gradient-to-r from-rose-500 to-red-600 text-white font-black text-lg md:text-xl px-8 py-4 rounded-full shadow-lg border-2 border-rose-200 flex items-center gap-3 animate-glow";
                micIcon.className = "fa-solid fa-microphone-lines text-2xl animate-pulse";
                micText.innerText = "正在聆聽... 請朗讀成語";
                wave.classList.remove("hidden");
            } else {
                micBtn.className = "relative group bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 active:scale-95 text-white font-black text-lg md:text-xl px-8 py-4 rounded-full shadow-lg border-2 border-amber-200 flex items-center gap-3 transition";
                micIcon.className = "fa-solid fa-microphone text-2xl";
                micText.innerText = "按住或點擊開口朗讀";
                wave.classList.add("hidden");
            }
        }

        // ----------------------------------------------------
        // 6. Speech Recognition Answer Checking Engine
        // ----------------------------------------------------
        function checkSpeechAnswer(speechText) {
            if (isCompleted || !speechText) return;

            const item = getCurrentItem();
            const targetChar = item.idiom[item.missingIndex];
            
            // Check if full idiom or key phrase with missing character is spoken
            const matchesFullIdiom = speechText.includes(item.idiom);
            const matchesKeywords = item.keywords.some(kw => speechText.includes(kw));
            const matchesTargetChar = speechText.includes(targetChar);

            if (matchesFullIdiom || (matchesKeywords && matchesTargetChar)) {
                triggerSuccessAnimation();
            }
        }

        function triggerSuccessAnimation() {
            isCompleted = true;
            stopListening();
            playSound('success');

            const item = getCurrentItem();
            const missingTile = document.getElementById("missing-char-tile");

            if (missingTile) {
                missingTile.innerText = item.idiom[item.missingIndex];
                missingTile.className = "w-16 h-20 md:w-20 md:h-24 rounded-2xl font-black text-3xl md:text-4xl flex items-center justify-center cursor-pointer select-none completed-tile animate-fill";
            }

            starCount += 1;
            document.getElementById("star-count").innerText = starCount;

            // Show Success Overlay
            setTimeout(() => {
                document.getElementById("success-idiom-text").innerText = item.idiom;
                document.getElementById("success-idiom-detail").innerText = 
                    `你成功唸出完整成語，並補齊了「${item.idiom[item.missingIndex]}」字！`;
                document.getElementById("success-overlay").classList.remove("hidden");
            }, 700);
        }

        // Text-To-Speech Standard Pronunciation Demo
        function playStandardSpeech() {
            playSound('click');
            const item = getCurrentItem();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // stop current sound
                const utterance = new SpeechSynthesisUtterance(item.idiom);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.85; // Slightly slower clear standard pronunciation for students
                window.speechSynthesis.speak(utterance);
            } else {
                alert(`示範發音：${item.idiom}`);
            }
        }

        // ----------------------------------------------------
        // 7. Navigation & Modals Logic
        // ----------------------------------------------------
        function closeSuccessAndNext() {
            document.getElementById("success-overlay").classList.add("hidden");
            nextIdiom();
        }

        function nextIdiom() {
            playSound('click');
            const category = IDIOM_DATABASE[currentCategoryIdx];
            if (currentItemIdx < category.items.length - 1) {
                currentItemIdx++;
            } else {
                // Loop or switch category
                currentCategoryIdx = (currentCategoryIdx + 1) % IDIOM_DATABASE.length;
                currentItemIdx = 0;
            }
            renderIdiomPuzzle();
        }

        function prevIdiom() {
            playSound('click');
            if (currentItemIdx > 0) {
                currentItemIdx--;
            } else if (currentCategoryIdx > 0) {
                currentCategoryIdx--;
                currentItemIdx = IDIOM_DATABASE[currentCategoryIdx].items.length - 1;
            }
            renderIdiomPuzzle();
        }

        function skipIdiom() {
            playStandardSpeech();
            const item = getCurrentItem();
            document.getElementById("recognized-text").innerText = `提示：${item.idiom}`;
        }

        // Category Modal Logic
        function toggleCategoryModal() {
            playSound('click');
            const modal = document.getElementById("category-modal");
            modal.classList.toggle("hidden");

            if (!modal.classList.contains("hidden")) {
                renderCategoryList();
            }
        }

        function renderCategoryList() {
            const listContainer = document.getElementById("category-list");
            listContainer.innerHTML = "";

            IDIOM_DATABASE.forEach((cat, idx) => {
                const card = document.createElement("div");
                card.className = `p-4 rounded-2xl border-2 cursor-pointer transition flex justify-between items-center ${
                    idx === currentCategoryIdx 
                    ? 'border-amber-500 bg-amber-50 shadow-md' 
                    : 'border-slate-200 hover:border-amber-300 hover:bg-slate-50'
                }`;

                card.onclick = () => {
                    currentCategoryIdx = idx;
                    currentItemIdx = 0;
                    toggleCategoryModal();
                    renderIdiomPuzzle();
                };

                card.innerHTML = `
                    <div>
                        <h4 class="font-black text-amber-900 text-base">${cat.category}</h4>
                        <p class="text-xs text-slate-500 font-bold mt-1">含 ${cat.items.length} 個必學成語</p>
                    </div>
                    <i class="fa-solid fa-chevron-right ${idx === currentCategoryIdx ? 'text-amber-500' : 'text-slate-300'}"></i>
                `;
                listContainer.appendChild(card);
            });
        }

        // Manual Input Fallback Modal
        function toggleManualInputModal() {
            playSound('click');
            const modal = document.getElementById("manual-modal");
            modal.classList.toggle("hidden");
            document.getElementById("manual-input").value = "";
        }

        function submitManualInput() {
            const val = document.getElementById("manual-input").value.trim();
            const item = getCurrentItem();

            if (val === item.idiom) {
                toggleManualInputModal();
                triggerSuccessAnimation();
            } else {
                alert(`輸入結果不吻合喔！答案是：${item.idiom}`);
            }
        }

        // ----------------------------------------------------
        // 8. Initialization on Page Load
        // ----------------------------------------------------
        window.onload = function() {
            initSpeechRecognition();
            renderIdiomPuzzle();
        };
    </script>
</body>
</html>
